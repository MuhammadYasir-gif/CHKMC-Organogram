<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHKMC Organogram</title>
<style>
:root{--brand:#d71920;--c2:#15151a;--bg:#f4f4f6;--card:#fff;--tx:#16161a;--mut:#6b6b76;--ln:#d9d9df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1d1d22;--tx:#f1f1f3;--mut:#9a9aa6;--ln:#34343c}}
:root[data-theme="dark"]{--bg:#121214;--card:#1d1d22;--tx:#f1f1f3;--mut:#9a9aa6;--ln:#34343c}
*{box-sizing:border-box}html,body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--c2);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:4px solid var(--brand);flex-wrap:wrap}
header img{height:40px;max-width:140px;object-fit:contain}header h1{font-size:17px;margin:0}header small{opacity:.7;display:block;font-weight:400}
.tabs{margin-left:auto;display:flex;gap:6px}
button,select,input[type=text]{font:inherit}
button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer}
button.p{background:var(--brand);border-color:var(--brand);color:#fff}button.on{outline:2px solid var(--brand)}
main{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
#wrap{flex:1 1 640px;min-width:0;overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:24px;max-height:calc(100vh - 110px)}
#chart{position:relative;margin:0 auto}#chart svg{position:absolute;left:0;top:0;overflow:visible}
.n{position:absolute;width:168px;height:64px;background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--t);border-radius:8px;padding:6px 8px;cursor:pointer;overflow:hidden;box-shadow:0 1px 3px #0002;transition:opacity .15s}
.n b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n span{font-size:11.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.n.sel{outline:2px solid var(--brand)}.n.dim{opacity:.3}.star{color:var(--brand)}
path.e{fill:none;stroke:var(--brand);stroke-width:2;transition:opacity .15s}path.s{stroke:var(--tx);stroke-opacity:.6;stroke-dasharray:6 4;stroke-width:1.8}
path.dim{opacity:.1}path.hl{stroke-width:3;opacity:1}
aside{flex:0 1 320px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}.box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.box label.f{display:block;margin:6px 0 2px;font-size:12px;color:var(--mut)}input[type=text],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--ln)}.row label{display:flex;gap:6px;align-items:center}.row .pr{font-size:12px;color:var(--mut)}
.lg{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}.lg i{display:inline-block;width:34px;border-top:2px solid var(--brand)}.lg i.d{border-top:2px dashed var(--tx);opacity:.6}.lg u{width:12px;height:12px;border-radius:3px;display:inline-block;text-decoration:none}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--ln);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--c2);color:#fff;position:sticky;top:-24px}
.mut{color:var(--mut);font-size:12px}details summary{cursor:pointer;font-weight:600}
@media print{header .tabs,aside{display:none}#wrap{max-height:none;border:0}}
</style></head><body>
<header><img id="logo" alt="" hidden><div><h1>China Hong Kong Motorsport Center (CHKMC)</h1><small>Organogram · reporting lines &amp; responsibilities</small></div>
<div class="tabs"><button id="b1" onclick="view('chart')">Chart</button><button id="b2" onclick="view('table')">Reporting table</button><button onclick="window.print()">Print / PDF</button></div></header>
<main><div id="wrap"></div><aside id="side"></aside></main>
<script>
const KEY='chkmc-org-v1',W=168,H=64,GX=22,GY=84,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=['#d71920','#1f6feb','#0a9d6b','#e8890c','#7a4fd6','#0f8b9e','#c2307a','#5d6b7a'];
const P=(id,name,title,team,mgrs=[],key=false)=>({id,name,title,team,mgrs,key});
const DEF={brand:{c1:'#d71920',c2:'#15151a',logo:''},people:[
P('steven','Steven','CEO','Leadership',[],1),P('enaam','Enaam','COO','Leadership',[],1),P('chester','Chester','Team Manager','Racing & Technical',[],1),
P('yasir','Yasir','Motorsport Business Development (MBD)','Business Development',['enaam','steven','chester']),
P('mahnoor','Mahnoor','Marcomms Manager','Marcomms',['enaam']),P('bobby','Bobby','Accountant 1','Finance',['steven','enaam']),P('dora','Dora','Accountant 2','Finance',['steven','enaam']),
P('rickard','Rickard','Technical Team Manager','Racing & Technical',['enaam']),P('maaz','Maaz','Team Manager (Mini Kart)','Racing & Technical',['enaam']),P('ping','Ping','Mechanic 1','Racing & Technical',['chester']),
P('ken','Ken','Front Desk Admin','Admin & IT',['yasir','mahnoor']),P('man','Man','Administrator','Admin & IT',['yasir','mahnoor']),P('raymond','Raymond','IT','Admin & IT',['enaam','yasir']),
P('william','William Lee','Content Creator','Marcomms',['mahnoor']),P('sree','Sree','Mechanic 2','Racing & Technical',['rickard']),P('shehzad','Shehzad','Mechanic 3','Racing & Technical',['rickard'])]};
let S,sel=null,mode='chart',armed=false;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.people)S=JSON.parse(JSON.stringify(DEF));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const by=id=>S.people.find(p=>p.id===id);
const teams=()=>[...new Set(S.people.map(p=>p.team||'Unassigned'))];
const tc=t=>PAL[teams().indexOf(t||'Unassigned')%PAL.length];
function desc(id){const o=new Set(),q=[id];while(q.length){const c=q.pop();S.people.forEach(p=>{if(p.mgrs.includes(c)&&!o.has(p.id)){o.add(p.id);q.push(p.id)}})}return o}
function layout(){
 S.people.forEach(p=>p.mgrs=p.mgrs.filter(m=>by(m)&&m!==p.id));
 const lv={},f=(id,seen=[])=>{if(lv[id]!=null)return lv[id];if(seen.includes(id))return 0;const m=by(id).mgrs;return lv[id]=m.length?1+Math.max(...m.map(x=>f(x,[...seen,id]))):0};
 S.people.forEach(p=>f(p.id));
 const rows=[];S.people.forEach(p=>(rows[lv[p.id]]=rows[lv[p.id]]||[]).push(p));
 const cols=Math.max(...rows.map(r=>r.length)),X={},Y={},bx=p=>p.mgrs.reduce((a,m)=>a+X[m],0)/p.mgrs.length;
 rows.forEach((r,i)=>{if(i>0)r.sort((a,b)=>bx(a)-bx(b));r.forEach((p,j)=>{X[p.id]=(cols-r.length)*(W+GX)/2+j*(W+GX);Y[p.id]=i*(H+GY)})});
 return{X,Y,w:cols*(W+GX)-GX,h:rows.length*(H+GY)-GY}}
function chart(){
 const{X,Y,w,h}=layout(),E=[];
 S.people.forEach(p=>p.mgrs.forEach((m,k)=>E.push({a:m,b:p.id,pri:k==0})));
 const outs={},ins={};E.forEach(e=>{(outs[e.a]=outs[e.a]||[]).push(e);(ins[e.b]=ins[e.b]||[]).push(e)});
 const spread=(l,n,i)=>(n>1?(i-(n-1)/2)*Math.min(24,(W-30)/(n-1)):0);
 Object.values(outs).forEach(l=>{l.sort((p,q)=>X[p.b]-X[q.b]);l.forEach((e,i)=>e.x1=X[e.a]+W/2+spread(l,l.length,i))});
 Object.values(ins).forEach(l=>{l.sort((p,q)=>X[p.a]-X[q.a]);l.forEach((e,i)=>e.x2=X[e.b]+W/2+spread(l,l.length,i))});
 const rel=new Set(sel?[sel]:[]);if(sel)E.forEach(e=>{if(e.a==sel)rel.add(e.b);if(e.b==sel)rel.add(e.a)});
 const paths=E.map(e=>{const y1=Y[e.a]+H,y2=Y[e.b],m=(y1+y2)/2,on=sel&&(e.a==sel||e.b==sel);
  return`<path class="e ${e.pri?'':'s'} ${sel?(on?'hl':'dim'):''}" d="M${e.x1} ${y1}C${e.x1} ${m} ${e.x2} ${m} ${e.x2} ${y2}"/>`}).join('');
 const nodes=S.people.map(p=>`<div class="n ${p.id==sel?'sel':''} ${sel&&!rel.has(p.id)?'dim':''}" style="left:${X[p.id]}px;top:${Y[p.id]}px;--t:${tc(p.team)}" onclick="pick('${p.id}')"><b>${p.key?'<span class="star">★</span> ':''}${esc(p.name)}</b><span>${esc(p.title)}</span></div>`).join('');
 return`<div id="chart" style="width:${w}px;height:${h}px"><svg width="${w}" height="${h}">${paths}</svg>${nodes}</div>`}
function table(){
 const nm=id=>esc(by(id).name);
 return`<table><tr><th>Person</th><th>Role</th><th>Primary line manager</th><th>Also reports to</th><th>Direct reports</th></tr>`+S.people.map(p=>`<tr><td><b>${p.key?'★ ':''}${esc(p.name)}</b></td><td>${esc(p.title)}</td><td>${p.mgrs[0]?nm(p.mgrs[0]):'<span class="mut">Top tier</span>'}</td><td>${p.mgrs.slice(1).map(nm).join(', ')||'<span class="mut">–</span>'}</td><td>${S.people.filter(q=>q.mgrs.includes(p.id)).map(q=>esc(q.name)).join(', ')||'<span class="mut">–</span>'}</td></tr>`).join('')+`</table>`}
function side(){
 const p=sel&&by(sel);let h=`<button class="p" onclick="add()">+ Add person</button>`;
 if(p){const bad=desc(p.id);
  h+=`<div class="box"><h3>Edit person</h3><label class="f">Name</label><input type="text" value="${esc(p.name)}" oninput="up('name',this.value)">
  <label class="f">Title / role</label><input type="text" value="${esc(p.title)}" oninput="up('title',this.value)">
  <label class="f">Team (sets colour)</label><input type="text" list="tl" value="${esc(p.team)}" oninput="up('team',this.value)"><datalist id="tl">${teams().map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
  <div class="row"><label><input type="checkbox" ${p.key?'checked':''} onchange="up('key',this.checked)"> ★ Key decision maker</label></div>
  <label class="f">Reports to (tick all; choose the primary line)</label>`+
  S.people.filter(m=>m.id!==p.id&&!bad.has(m.id)).map(m=>{const on=p.mgrs.includes(m.id);return`<div class="row"><label><input type="checkbox" ${on?'checked':''} onchange="tm('${m.id}',this.checked)">${esc(m.name)}</label><label class="pr"><input type="radio" name="pri" ${p.mgrs[0]==m.id?'checked':''} ${on?'':'disabled'} onchange="mp('${m.id}')">primary</label></div>`}).join('')+
  `<button style="margin-top:10px" onclick="del()">${armed?'Click again to confirm delete':'Delete person'}</button></div>`}
 else h+=`<div class="box"><h3>How to use</h3><div class="mut">Click anyone to isolate their reporting lines and edit them. Click the empty chart area again to clear.</div></div>`;
 h+=`<div class="box"><h3>Legend</h3><div class="lg"><i></i>Primary line manager</div><div class="lg"><i class="d"></i>Additional reporting line</div><div class="lg"><span class="star">★</span>Key decision maker</div>${teams().map(t=>`<div class="lg"><u style="background:${tc(t)}"></u>${esc(t)}</div>`).join('')}</div>
 <div class="box"><details><summary>Branding</summary><label class="f">Brand colour</label><input type="color" value="${S.brand.c1}" oninput="br('c1',this.value)"><label class="f">Header colour</label><input type="color" value="${S.brand.c2}" oninput="br('c2',this.value)"><label class="f">Logo image</label><input type="file" accept="image/*" onchange="lg(this)"></details></div>
 <div class="box"><details><summary>Backup &amp; restore</summary><div class="mut">Changes save in this browser only. Copy this text to back up or move to another device; paste a saved copy and press Load.</div><textarea id="dat" rows="5">${esc(JSON.stringify({people:S.people,brand:{c1:S.brand.c1,c2:S.brand.c2}}))}</textarea><button onclick="ld()">Load</button> <button onclick="rs()">Reset to starting data</button></details></div>`;
 $('#side').innerHTML=h}
function brand(){const r=document.documentElement.style;r.setProperty('--brand',S.brand.c1);r.setProperty('--c2',S.brand.c2);const i=$('#logo');i.hidden=!S.brand.logo;if(S.brand.logo)i.src=S.brand.logo}
function draw(){$('#wrap').innerHTML=mode=='chart'?chart():table();$('#b1').className=mode=='chart'?'on':'';$('#b2').className=mode=='table'?'on':''}
function all(){draw();side();brand()}
function view(m){mode=m;draw()}
function pick(id){sel=sel==id?null:id;armed=false;all()}
function up(k,v){by(sel)[k]=v;save();draw();if(k=='team'||k=='key')side()}
function tm(id,on){const p=by(sel);p.mgrs=on?[...p.mgrs,id]:p.mgrs.filter(x=>x!=id);save();all()}
function mp(id){const p=by(sel);p.mgrs=[id,...p.mgrs.filter(x=>x!=id)];save();all()}
function add(){const id='p'+Date.now();S.people.push(P(id,'New person','Title','Unassigned',[]));sel=id;save();all()}
function del(){if(!armed){armed=true;side();return}S.people.forEach(p=>p.mgrs=p.mgrs.filter(m=>m!=sel));S.people=S.people.filter(p=>p.id!=sel);sel=null;armed=false;save();all()}
function br(k,v){S.brand[k]=v;save();brand()}
function lg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.brand.logo=r.result;save();brand()};r.readAsDataURL(f)}
function ld(){try{const d=JSON.parse($('#dat').value);if(!Array.isArray(d.people))throw 0;S.people=d.people;if(d.brand)Object.assign(S.brand,d.brand);sel=null;save();all()}catch(e){alert('That text is not valid organogram data.')}}
function rs(){S=JSON.parse(JSON.stringify(DEF));sel=null;save();all()}
$('#wrap').addEventListener('click',e=>{if(e.target.id=='wrap'||e.target.id=='chart'||e.target.tagName=='svg'){sel=null;all()}});
all();
</script></body></html>

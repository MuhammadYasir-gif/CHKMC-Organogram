<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHKMC Organogram</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e3131b;--blue:#2b3190;--lb:#8b94ff;--gold:#d4a017;--ink:#0b0c18;--card:#14162b;--tx:#f2f3fa;--mut:#9ba0c4;--ln:#2a2d52;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:var(--ink);color:var(--tx);font:14px/1.4 "Noto Sans JP","Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif}
#bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#080912;border-bottom:2px solid var(--red);flex-wrap:wrap}
#bar span{font:700 18px Teko,Oswald,Impact,sans-serif;letter-spacing:.08em;margin-right:auto}
button{font:inherit;border:1px solid var(--ln);background:#1b1e3d;color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--lb)}button.p{background:var(--red);border-color:var(--red);font-weight:700}button.on{outline:2px solid var(--gold)}
main{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
#holder{flex:1 1 640px;min-width:0;overflow:auto;max-height:calc(100vh - 80px);border-radius:8px;border:1px solid var(--ln)}
#poster{position:relative;width:1587px;height:1123px;transform-origin:0 0;overflow:hidden;background:var(--ink);font-family:"Noto Sans JP","Noto Sans TC","PingFang HK",sans-serif}
#poster>*{position:absolute}#bg{left:0;top:0}
.tk{font-family:Teko,Oswald,Impact,"Arial Narrow",sans-serif}
#plateR{left:-40px;top:0;width:560px;height:150px;background:var(--red);clip-path:polygon(0 0,100% 0,calc(100% - 44px) 100%,0 100%)}
#plate{left:-40px;top:0;width:540px;height:150px;background:#fff;clip-path:polygon(0 0,100% 0,calc(100% - 44px) 100%,0 100%);display:flex;align-items:center;justify-content:center;padding-left:40px}
#plate img{width:410px;display:block}
#ttl{left:560px;top:12px;width:620px}
#ttl small{display:block;color:var(--gold);font-weight:700;letter-spacing:.3em;font-size:15px}
#ttl h1{margin:0;font:italic 700 84px/0.95 Teko,Oswald,Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase}#ttl h1 i{color:var(--red);font-style:italic}
#ttl p{margin:2px 0 0;color:var(--mut);letter-spacing:.2em;font-size:12px;font-weight:700}
#stats{right:30px;top:20px;display:flex;gap:10px;align-items:stretch}
.st{background:#0b0c18e0;border:1px solid #ffffff30;border-left:4px solid var(--red);padding:2px 14px 4px;transform:skewX(-10deg);text-align:center}
.st:nth-child(2){border-left-color:var(--gold)}.st:nth-child(3){border-left-color:var(--lb)}
.st b{display:block;font:700 44px/1 Teko,Oswald,Impact,sans-serif}.st em{display:block;font-style:normal;font-size:10px;letter-spacing:.18em;color:var(--mut);font-weight:700;white-space:nowrap}
#upd{right:32px;top:122px;font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:700}
#stage{left:60px;top:190px;width:1467px;height:845px;overflow:hidden}#stage.tb{overflow:auto}
#ft{left:0;top:1053px;width:1587px;height:70px;display:flex;align-items:center;gap:22px;padding:0 44px;font-size:13px;font-weight:700;letter-spacing:.05em}
#ft .sp{margin-left:auto;color:var(--mut);letter-spacing:.2em;font-size:11px}
.lg{display:flex;align-items:center;gap:7px;white-space:nowrap}.lg u{width:14px;height:14px;border-radius:3px;display:inline-block}.lg svg{width:44px;height:10px}
#chart{position:absolute;transform-origin:0 0}#chart svg{position:absolute;left:0;top:0;overflow:visible}
.n{position:absolute;width:220px;height:88px;background:linear-gradient(135deg,#1a1d3b,#0f1124);border:1px solid #ffffff2a;border-left:7px solid var(--t);border-radius:6px 18px 6px 18px;padding:8px 10px 8px 8px;cursor:pointer;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px #0008;transition:opacity .15s}
.n.k{border-color:var(--gold);border-left-color:var(--t);box-shadow:0 0 0 1px var(--gold),0 4px 14px #0008}
.n.sel{outline:3px solid #fff;outline-offset:2px}.n.dim{opacity:.28}
.ph{position:relative;flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--t);background:#222650;overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 26px Teko,Oswald,Impact,sans-serif;color:#cfd3ff;letter-spacing:.04em}
.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:#fff;font-style:normal;font-size:22px;opacity:0;transition:opacity .15s}.ph:hover em{opacity:1}
.n .tx{min-width:0}.n b{display:block;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n .tx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25;color:var(--mut)}
.star{color:var(--gold)}
path.e{fill:none;stroke:#ff3b47;stroke-width:3;filter:drop-shadow(0 0 4px #e3131b);transition:opacity .15s}path.s{stroke:var(--lb);stroke-dasharray:9 7;stroke-width:2.6;filter:none}path.dim{opacity:.08}path.hl{stroke-width:4.5}
aside{flex:0 1 320px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}.box h3{margin:0 0 8px;font:700 17px Teko,Oswald,sans-serif;letter-spacing:.12em;color:var(--gold)}
.box label.f{display:block;margin:6px 0 2px;font-size:12px;color:var(--mut)}input[type=text],textarea{width:100%;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--ink);color:var(--tx);font:inherit}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--ln)}.row label{display:flex;gap:6px;align-items:center}.row .pr{font-size:12px;color:var(--mut)}
.mut{color:var(--mut);font-size:12px}details summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--ln);padding:9px 10px;text-align:left;vertical-align:top}th{background:var(--red);font:700 17px Teko,Oswald,sans-serif;letter-spacing:.1em;position:sticky;top:0}
@page{size:420mm 297mm;margin:0}
@media print{html,body{background:var(--ink)!important;width:1587px;height:1122px;overflow:hidden}#bar,aside{display:none!important}main{display:block;padding:0}
#holder{width:1587px!important;height:1122px!important;max-height:none;overflow:hidden;border:0;border-radius:0}#scaler{width:1587px!important;height:1122px!important}#poster{transform:none!important}.ph em{display:none}path.e{filter:none}}
</style></head><body>

 $('#bg').innerHTML=`<defs><radialGradient id="g" cx=".5" cy=".1" r=".9"><stop offset="0" stop-color="#23264d"/><stop offset=".55" stop-color="#101226"/><stop offset="1" stop-color="#07080f"/></radialGradient>
 <pattern id="sei" width="40" height="20" patternUnits="userSpaceOnUse"><g fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1.5"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="6"/><circle cx="0" cy="0" r="18"/><circle cx="0" cy="0" r="12"/><circle cx="0" cy="0" r="6"/><circle cx="40" cy="0" r="18"/><circle cx="40" cy="0" r="12"/><circle cx="40" cy="0" r="6"/></g></pattern>
 <pattern id="chk" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#0b0c18"/><rect width="14" height="14" fill="#fff"/><rect x="14" y="14" width="14" height="14" fill="#fff"/></pattern>
 <linearGradient id="lt"><stop offset="0" stop-color="#e3131b"/><stop offset="1" stop-color="#3b43d6"/></linearGradient></defs>
 <rect width="${PW}" height="${PH}" fill="url(#g)"/>${r}<circle cx="${cx}" cy="${cy+70}" r="260" fill="#e3131b" opacity=".07"/>
 <text x="1190" y="900" font-size="640" font-weight="900" fill="#fff" opacity=".035" font-family="Noto Sans JP,sans-serif">速</text>
 <rect width="${PW}" height="150" fill="#080913"/><rect width="${PW}" height="150" fill="url(#sei)"/>
 <polygon points="1040,0 1110,0 1020,150 950,150" fill="#e3131b" opacity=".85"/><polygon points="1120,0 1150,0 1060,150 1030,150" fill="#3b43d6"/><polygon points="1160,0 1175,0 1085,150 1070,150" fill="#fff" opacity=".8"/>
 <rect y="150" width="${PW}" height="28" fill="url(#chk)"/><rect y="178" width="${PW}" height="3" fill="url(#lt)"/>
 <rect y="1053" width="${PW}" height="70" fill="#080913"/><rect y="1053" width="${PW}" height="70" fill="url(#sei)"/><rect y="1050" width="${PW}" height="4" fill="url(#lt)"/>
 <g stroke="#d4a017" fill="none" stroke-width="3" opacity=".75">${fret(26,196,1,1)}${fret(PW-26,196,-1,1)}${fret(26,1034,1,-1)}${fret(PW-26,1034,-1,-1)}</g>`}
function chart(){
 S.people.forEach(p=>p.mgrs=p.mgrs.filter(m=>by(m)&&m!==p.id));
 const lv={},f=(id,seen=[])=>{if(lv[id]!=null)return lv[id];if(seen.includes(id))return 0;const m=by(id).mgrs;return lv[id]=m.length?1+Math.max(...m.map(x=>f(x,[...seen,id]))):0};
 S.people.forEach(p=>f(p.id));
 const rows=[];S.people.forEach(p=>(rows[lv[p.id]]=rows[lv[p.id]]||[]).push(p));
 const cols=Math.max(...rows.map(r=>r.length)),cw=cols*(W+GX)-GX,s=Math.min(1.25,SW/cw);
 const gy=rows.length>1?Math.max(70,Math.min(230,(SH/s-rows.length*H)/(rows.length-1))):0,ch=rows.length*H+(rows.length-1)*gy;
 const X={},Y={},bx=p=>p.mgrs.reduce((a,m)=>a+X[m],0)/p.mgrs.length;
 rows.forEach((r,i)=>{if(i>0)r.sort((a,b)=>bx(a)-bx(b));r.forEach((p,j)=>{X[p.id]=(cols-r.length)*(W+GX)/2+j*(W+GX);Y[p.id]=i*(H+gy)})});
 const E=[];S.people.forEach(p=>p.mgrs.forEach((m,k)=>E.push({a:m,b:p.id,pri:k==0})));
 const outs={},ins={};E.forEach(e=>{(outs[e.a]=outs[e.a]||[]).push(e);(ins[e.b]=ins[e.b]||[]).push(e)});
 const sp=(n,i)=>n>1?(i-(n-1)/2)*Math.min(26,(W-40)/(n-1)):0;
 Object.values(outs).forEach(l=>{l.sort((p,q)=>X[p.b]-X[q.b]);l.forEach((e,i)=>e.x1=X[e.a]+W/2+sp(l.length,i))});
 Object.values(ins).forEach(l=>{l.sort((p,q)=>X[p.a]-X[q.a]);l.forEach((e,i)=>e.x2=X[e.b]+W/2+sp(l.length,i))});
 const rel=new Set(sel?[sel]:[]);if(sel)E.forEach(e=>{if(e.a==sel)rel.add(e.b);if(e.b==sel)rel.add(e.a)});
 const paths=E.map(e=>{const y1=Y[e.a]+H,y2=Y[e.b],m=(y1+y2)/2,on=sel&&(e.a==sel||e.b==sel);
  return`<path class="e ${e.pri?'':'s'} ${sel?(on?'hl':'dim'):''}" d="M${e.x1} ${y1}C${e.x1} ${m} ${e.x2} ${m} ${e.x2} ${y2}"/>`}).join('');
 const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
 const nodes=S.people.map(p=>`<div class="n ${p.key?'k':''} ${p.id==sel?'sel':''} ${sel&&!rel.has(p.id)?'dim':''}" style="left:${X[p.id]}px;top:${Y[p.id]}px;--t:${tc(p.team)}" onclick="pick('${p.id}')"><div class="ph" title="Click to upload photo" onclick="event.stopPropagation();ph('${p.id}')">${p.photo?`<img src="${p.photo}" alt="">`:esc(ini(p.name))}<em>📷</em></div><div class="tx"><b>${p.key?'<span class="star">★</span> ':''}${esc(p.name)}</b><span>${esc(p.title)}</span></div></div>`).join('');
 return`<div id="chart" style="width:${cw}px;height:${ch}px;transform:scale(${s});left:${(SW-cw*s)/2}px;top:${(SH-ch*s)/2}px"><svg width="${cw}" height="${ch}">${paths}</svg>${nodes}</div>`}
function table(){const nm=id=>esc(by(id).name);
 return`<table><tr><th>PERSON</th><th>ROLE</th><th>PRIMARY LINE MANAGER</th><th>ALSO REPORTS TO</th><th>DIRECT REPORTS</th></tr>`+S.people.map(p=>`<tr><td><b>${p.key?'<span class="star">★</span> ':''}${esc(p.name)}</b></td><td>${esc(p.title)}</td><td>${p.mgrs[0]?nm(p.mgrs[0]):'<span class="mut">Top tier</span>'}</td><td>${p.mgrs.slice(1).map(nm).join(', ')||'<span class="mut">–</span>'}</td><td>${S.people.filter(q=>q.mgrs.includes(p.id)).map(q=>esc(q.name)).join(', ')||'<span class="mut">–</span>'}</td></tr>`).join('')+`</table>`}
function poster(){
 $('#stage').className=mode=='table'?'tb':'';$('#stage').innerHTML=mode=='chart'?chart():table();
 $('#stats').innerHTML=[[S.people.length,'TEAM MEMBERS'],[S.people.filter(p=>p.key).length,'KEY DECISION MAKERS'],[teams().length,'TEAMS']].map(a=>`<div class="st"><b>${a[0]}</b><em>${a[1]}</em></div>`).join('');
 $('#upd').textContent='UPDATED '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
 $('#ft').innerHTML=`<div class="lg"><svg viewBox="0 0 44 10"><path d="M0 5H44" stroke="#ff3b47" stroke-width="3"/></svg>Primary line manager</div><div class="lg"><svg viewBox="0 0 44 10"><path d="M0 5H44" stroke="#8b94ff" stroke-width="3" stroke-dasharray="9 7"/></svg>Also reports to</div><div class="lg"><span class="star">★</span>Key decision maker</div>`+teams().map(t=>`<div class="lg"><u style="background:${tc(t)}"></u>${esc(t)}</div>`).join('')+`<div class="sp">CHINA HONG KONG MOTORSPORTS CENTRE · モータースポーツ · INTERNAL</div>`;
 $('#b1').className=mode=='chart'?'on':'';$('#b2').className=mode=='table'?'on':''}
function side(){
 const p=sel&&by(sel);let h=`<button class="p" onclick="add()">+ Add person</button>`;
 if(p){const bad=desc(p.id);
  h+=`<div class="box"><h3>EDIT PERSON</h3><button onclick="ph('${p.id}')">📷 ${p.photo?'Change':'Upload'} photo</button> ${p.photo?`<button onclick="up('photo','');side()">Remove</button>`:''}
  <label class="f">Name</label><input type="text" value="${esc(p.name)}" oninput="up('name',this.value)">
  <label class="f">Title / role</label><input type="text" value="${esc(p.title)}" oninput="up('title',this.value)">
  <label class="f">Team (sets colour)</label><input type="text" list="tl" value="${esc(p.team)}" oninput="up('team',this.value)"><datalist id="tl">${teams().map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
  <div class="row"><label><input type="checkbox" ${p.key?'checked':''} onchange="up('key',this.checked)"> ★ Key decision maker</label></div>
  <label class="f">Reports to (tick all; choose the primary line)</label>`+
  S.people.filter(m=>m.id!==p.id&&!bad.has(m.id)).map(m=>{const on=p.mgrs.includes(m.id);return`<div class="row"><label><input type="checkbox" ${on?'checked':''} onchange="tm('${m.id}',this.checked)">${esc(m.name)}</label><label class="pr"><input type="radio" name="pri" ${p.mgrs[0]==m.id?'checked':''} ${on?'':'disabled'} onchange="mp('${m.id}')">primary</label></div>`}).join('')+
  `<button style="margin-top:10px" onclick="del()">${armed?'Click again to confirm delete':'Delete person'}</button></div>`}
 else h+=`<div class="box"><h3>HOW TO USE</h3><div class="mut">Click a person to isolate their reporting lines and edit them. Click the 📷 circle on any box to upload a photo. Click empty space to clear.</div></div>`;
 h+=`<div class="box"><details><summary>Backup &amp; restore</summary><div class="mut">Changes save in this browser only. Copy this text to back up or move to another device; paste a saved copy and press Load.</div><textarea id="dat" rows="5">${esc(JSON.stringify({people:S.people}))}</textarea><button onclick="ld()">Load</button> <button onclick="rs()">Reset</button></details></div>`;
 $('#side').innerHTML=h}
function fit(){const h=$('#holder'),s=fitZ?Math.min(1.6,(h.clientWidth-2)/PW):1;$('#poster').style.transform=`scale(${s})`;const c=$('#scaler').style;c.width=PW*s+'px';c.height=PH*s+'px'}
function all(){poster();side();fit()}
function view(m){mode=m;poster()}
function zm(){fitZ=!fitZ;$('#bz').textContent='Zoom: '+(fitZ?'Fit':'100%');fit()}
function pr(){mode='chart';sel=null;all();setTimeout(()=>window.print(),150)}
function pick(id){sel=sel==id?null:id;armed=false;all()}
function up(k,v){by(sel)[k]=v;save();poster();if(k=='team'||k=='key')side()}
function tm(id,on){const p=by(sel);p.mgrs=on?[...p.mgrs,id]:p.mgrs.filter(x=>x!=id);save();all()}
function mp(id){const p=by(sel);p.mgrs=[id,...p.mgrs.filter(x=>x!=id)];save();all()}
function add(){const id='p'+Date.now();S.people.push(P(id,'New person','Title','Unassigned',[]));sel=id;save();all()}
function del(){if(!armed){armed=true;side();return}S.people.forEach(p=>p.mgrs=p.mgrs.filter(m=>m!=sel));S.people=S.people.filter(p=>p.id!=sel);sel=null;armed=false;save();all()}
function ph(id){phTo=id;const i=$('#fi');i.value='';i.click()}
$('#fi').onchange=function(){const f=this.files[0];if(!f||!phTo)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=240,m=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);by(phTo).photo=c.toDataURL('image/jpeg',.85);save();all()};im.src=r.result};r.readAsDataURL(f)};
function ld(){try{const d=JSON.parse($('#dat').value);if(!Array.isArray(d.people))throw 0;S.people=d.people;sel=null;save();all()}catch(e){alert('That text is not valid organogram data.')}}
function rs(){S={people:JSON.parse(JSON.stringify(DEF))};sel=null;save();all()}
$('#stage').addEventListener('click',e=>{if(['stage','chart'].includes(e.target.id)||e.target.tagName=='svg'){sel=null;all()}});
addEventListener('resize',fit);bg();all();
</script></body></html>
